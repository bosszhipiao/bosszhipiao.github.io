title: 此间文字
email: private@localhost
tagline: 所见、所思、所读
description: >-
  此间文字是一个私人文学博客，记录职场札记、读书笔记、网文摘录、原创随笔与碎片感悟——所见、所思、所读。
baseurl: ""
url: "https://bosszhipiao.github.io"
locale: "zh_CN"
logo: /assets/images/logo.png

permalink: /:categories/:title/
markdown: kramdown
highlighter: rouge
timezone: Asia/Shanghai
future: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  pages:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: bosszhipiao
      image: /assets/images/og-default.png
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .gitignore
