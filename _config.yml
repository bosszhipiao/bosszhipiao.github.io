title: bosszhipiao
email: your-email@example.com
description: >-
  我的个人博客，记录技术、生活和学习心得。
baseurl: ""
url: "https://bosszhipiao.github.io"

permalink: /:categories/:title/
markdown: kramdown
highlighter: rouge
timezone: Asia/Shanghai

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  pages:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
      author: bosszhipiao
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .gitignore

include:
  - .well-known

utterances:
  enabled: true
  repo: bosszhipiao/bosszhipiao.github.io
  issue-term: title
  theme: github-light
  label: comment

paginate: 8
paginate_path: "/page:num/"
