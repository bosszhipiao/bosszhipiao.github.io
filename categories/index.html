---
layout: default
title: 分类
permalink: /categories/
---

<section class="container page-section">
  <h1>分类</h1>
  <div class="category-list">
    {% for category in site.categories %}
      <div id="{{ category[0] | slugify }}" class="category-group">
        <h2>{{ category[0] }}</h2>
        <ul>
          {% for post in category[1] %}
            <li>
              <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
              <span style="color:var(--muted);font-size:0.82rem;margin-left:8px;">{{ post.date | date: "%Y-%m-%d" }}</span>
            </li>
          {% endfor %}
        </ul>
      </div>
    {% endfor %}
  </div>
</section>
