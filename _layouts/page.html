---
layout: default
---

<article class="article container">
  <header class="article-header">
    <h1>{{ page.title }}</h1>
  </header>

  {% if page.image %}
  <div class="featured-image" style="text-align:center;margin:24px 0;">
    <img src="{{ page.image | relative_url }}" alt="{{ page.title | escape }}" style="border-radius:4px;max-height:400px;object-fit:cover;width:100%;" />
  </div>
  {% endif %}

  <div class="article-content">
    {{ content }}
  </div>
</article>
