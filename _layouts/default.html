<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="32x32" />
    <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32.png' | relative_url }}" />
    <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}" />
    <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}" />
    <meta name="theme-color" content="#efe8d8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1d1f" media="(prefers-color-scheme: dark)" />
    {% if page.robots %}<meta name="robots" content="{{ page.robots }}" />{% endif %}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
    <script>
      // 主题早期应用，避免明暗闪烁
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme;
          if (saved === 'light' || saved === 'dark') {
            theme = saved;
          } else {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    {% feed_meta %}
    {% seo %}
  </head>
  <body>
    <div class="reading-progress" id="readingProgress"></div>

    {% include header.html %}

    <main>
      {{ content }}
    </main>

    {% include footer.html %}

    <button class="back-to-top" id="backToTop" aria-label="返回顶部">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M12 4l-8 8h5v8h6v-8h5z" fill="currentColor"/>
      </svg>
    </button>

    <script>
      (function () {
        // 阅读进度条
        var bar = document.getElementById('readingProgress');
        function updateProgress() {
          var h = document.documentElement;
          var scroll = h.scrollTop || document.body.scrollTop;
          var max = h.scrollHeight - h.clientHeight;
          var p = max > 0 ? scroll / max : 0;
          if (bar) bar.style.transform = 'scaleX(' + p + ')';
        }
        // 返回顶部
        var back = document.getElementById('backToTop');
        function updateBack() {
          if (!back) return;
          var scroll = document.documentElement.scrollTop || document.body.scrollTop;
          if (scroll > 600) back.classList.add('show');
          else back.classList.remove('show');
        }
        window.addEventListener('scroll', function () {
          updateProgress();
          updateBack();
        }, { passive: true });
        if (back) {
          back.addEventListener('click', function () {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        }
        updateProgress();
        updateBack();

        // 滚动渐入：给卡片、列表项、文章块、侧边栏加渐入
        var revealSelector = '.category-nav-card, .featured-card, .post-item, .sidebar-section, .archive-year, .category-group, .tag-group';
        var els = document.querySelectorAll(revealSelector);
        if ('IntersectionObserver' in window && els.length) {
          els.forEach(function (el) {
            el.classList.add('reveal');
          });
          var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add('in');
                io.unobserve(entry.target);
              }
            });
          }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
          els.forEach(function (el) { io.observe(el); });
        }
      })();

      // 暗黑模式切换：跟随系统默认，用户切换后写入 localStorage
      var toggle = document.getElementById('themeToggle');
      function currentTheme() {
        return document.documentElement.getAttribute('data-theme') || 'light';
      }
      function syncToggleIcon() {
        var t = currentTheme();
        if (!toggle) return;
        toggle.classList.toggle('is-dark', t === 'dark');
        toggle.setAttribute('aria-label', t === 'dark' ? '切换为亮色' : '切换为暗黑');
      }
      if (toggle) {
        toggle.addEventListener('click', function () {
          var next = currentTheme() === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          try { localStorage.setItem('theme', next); } catch (e) {}
          syncToggleIcon();
        });
        syncToggleIcon();
      }
      // 系统偏好变化时若用户未自定义则跟随
      if (window.matchMedia) {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        var onChange = function (e) {
          try { if (localStorage.getItem('theme')) return; } catch (e) { return; }
          var next = e.matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', next);
          syncToggleIcon();
        };
        if (mq.addEventListener) mq.addEventListener('change', onChange);
        else if (mq.addListener) mq.addListener(onChange);
      }
    </script>
  </body>
</html>
