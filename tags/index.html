---
layout: default
title: 标签
permalink: /tags/
---

<section class="container page-section">
  <h1>标签</h1>
  <div class="tag-cloud">
    {% for tag in site.tags %}
      <a id="{{ tag[0] | slugify }}" href="#{{ tag[0] | slugify }}">#{{ tag[0] }}</a>
    {% endfor %}
  </div>

  <div class="tag-list">
    {% for tag in site.tags %}
      <div id="{{ tag[0] | slugify }}" class="tag-group">
        <h2>#{{ tag[0] }}</h2>
        <ul>
          {% for post in tag[1] %}
            <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a></li>
          {% endfor %}
        </ul>
      </div>
    {% endfor %}
  </div>
</section>
